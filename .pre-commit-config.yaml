repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        # No --config: let ruff auto-discover the nearest ruff.toml per file, so
        # per-world ruff.toml ignores actually apply there instead of being
        # overridden by this repo-root config.
        entry: ruff check --fix
        language: system
        types: [python]
